name: dashboard-tests

on:
  push:
    paths:
      - "dashboard/src/**"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "dashboard/next.config.mjs"
      - "dashboard/tsconfig.json"
      - "dashboard/vitest.config.ts"
      - "client/pari-client.ts"
  pull_request:
    paths:
      - "dashboard/src/**"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "dashboard/next.config.mjs"
      - "dashboard/tsconfig.json"
      - "dashboard/vitest.config.ts"
      - "client/pari-client.ts"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.1, pinned via `gh api repos/actions/checkout/git/ref/tags/v4`
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # actions/setup-node v4.4.0, pinned via `gh api repos/actions/setup-node/git/ref/tags/v4`
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
        working-directory: dashboard
      - run: npx vitest run
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
