[package]
name = "pari-market"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pari_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"

# Mirrors programs/worldcup-settlement's dev-dependency set (same litesvm-based
# in-process SVM test pattern, already resolved+locked in the workspace
# Cargo.lock -- no new crate introduced to the dependency graph).
[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.2.0"
solana-clock = "3.1.1"
solana-instruction = "3"
solana-message = "3.0.1"
solana-program-pack = "3"
solana-pubkey = "3"
solana-system-interface = "2.0.0"
solana-sysvar = "3.1.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
# M2a: parses fixtures/roots.json (a `solana account -o ... --output json`
# dump) to load the real daily_scores_roots account into litesvm. Already
# resolved+locked in the workspace Cargo.lock (transitive across the
# workspace) -- reuse, not a new dependency introduced to the graph.
serde_json = "1.0.150"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
